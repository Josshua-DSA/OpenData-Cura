name: Data Pipeline CI & Quality Gates

on:
  push:
    branches: [ main, joshua, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-data-pipeline:
    name: Run Data & API Test Suites
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: cura_db
          POSTGRES_USER: cura_user
          POSTGRES_PASSWORD: cura_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: cura_db
      DB_USER: cura_user
      DB_PASSWORD: cura_password
      # Test-only JWT secret (satisfies the boot guard; never used in production)
      JWT_SECRET_KEY: ci_test_only_jwt_secret_key_0123456789_abcdefghijklmnop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies (database + backend)
        run: |
          python -m pip install --upgrade pip
          pip install -r database/requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Initialize Database Schema & Seed All Domains
        run: |
          PYTHONPATH=database python database/cli.py init-db
          PYTHONPATH=database python database/cli.py seed-wilayah
          PYTHONPATH=database python database/cli.py seed-references
          PYTHONPATH=database python database/cli.py seed-puskesmas
          PYTHONPATH=database python database/cli.py seed-workforce
          PYTHONPATH=database python database/cli.py seed-morbidity
          PYTHONPATH=database python database/cli.py seed-kia
          PYTHONPATH=database python database/cli.py seed-surveillance
          PYTHONPATH=database python database/cli.py seed-alert-rules
          PYTHONPATH=database python database/cli.py run-etl

      - name: Run Data Pipeline Tests (database/tests)
        run: |
          PYTHONPATH=database pytest database/tests/ -v --tb=short

      - name: Run Backend API Tests (backend/tests)
        run: |
          PYTHONPATH=. pytest backend/tests/ -v --tb=short
