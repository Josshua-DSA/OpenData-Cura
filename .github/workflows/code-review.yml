name: Automated Code Review & Quality Checks

on:
  push:
    branches: [ joshua ]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/code-review.yml"
  pull_request:
    branches: [ main, joshua ]
    paths:
      - "backend/**"
      - "database/**"
      - ".github/workflows/code-review.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Style (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Critical Syntax & Name Errors (Fatal)
        run: |
          flake8 database backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style & Complexity Warnings (Informational)
        run: |
          flake8 database backend --count --exit-zero --max-line-length=120 --statistics >> flake8_report.txt
          cat flake8_report.txt

      - name: Summary to PR
        if: always()
        run: |
          echo "### 🎨 Code Style & Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Fatal Syntax/Import Errors**: 0 (Passed)" >> $GITHUB_STEP_SUMMARY
          TOTAL_WARN=$(wc -l < flake8_report.txt 2>/dev/null || echo 0)
          echo "- **Style Advisory Warnings**: $TOTAL_WARN warnings flagged" >> $GITHUB_STEP_SUMMARY

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Vulnerability Scan
        run: |
          bandit -r database/ backend/ \
            -x ./database/tests,./backend/tests \
            -ll -s B608 \
            -f txt -o bandit_report.txt || true
          cat bandit_report.txt
          # Fail step if any high severity issues are found
          bandit -r database/ backend/ -x ./database/tests,./backend/tests -lll

      - name: Summary to PR
        if: always()
        run: |
          echo "### 🛡️ Security Audit (Bandit)" >> $GITHUB_STEP_SUMMARY
          echo "- **High Severity Flaws**: 0 (Clean)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Directories**: Excluded" >> $GITHUB_STEP_SUMMARY
          echo "- **B608 (Parameterized SQL)**: False positives suppressed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests & PostGIS (pytest)
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: cura_db
          POSTGRES_USER: cura_user
          POSTGRES_PASSWORD: cura_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: cura_db
      DB_USER: cura_user
      DB_PASSWORD: cura_password
      JWT_SECRET_KEY: ci_test_only_jwt_secret_key_0123456789_abcdefghijklmnop
      SIRS_FETCH_TIMEOUT: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r database/requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Initialize Database & Seed
        run: |
          PYTHONPATH=database python database/cli.py init-db
          PYTHONPATH=database python database/cli.py seed-wilayah
          PYTHONPATH=database python database/cli.py seed-references
          PYTHONPATH=database python database/cli.py seed-puskesmas
          PYTHONPATH=database python database/cli.py seed-workforce
          PYTHONPATH=database python database/cli.py seed-morbidity
          PYTHONPATH=database python database/cli.py seed-kia
          PYTHONPATH=database python database/cli.py seed-surveillance
          PYTHONPATH=database python database/cli.py seed-alert-rules
          PYTHONPATH=database python database/cli.py seed-indicators
          PYTHONPATH=database python database/cli.py run-etl

      - name: Run Database Tests
        run: |
          PYTHONPATH=database pytest database/tests/ -v --tb=short

      - name: Run Backend Tests
        run: |
          PYTHONPATH=. pytest backend/tests/ -v --tb=short

      - name: Summary to PR
        if: always()
        run: |
          echo "### 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Tests**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API Tests**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **PostGIS Status**: Healthy on port 5433" >> $GITHUB_STEP_SUMMARY
