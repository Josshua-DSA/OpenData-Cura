# Docker Compose Lean Profile — Cura HealthTrust Facilities
# Optimized for 1 vCPU / 1 GB RAM VPS (~Rp 50.000/bln)
# Total RAM footprint: ~420 MB (No Celery, No Redis, No Airflow, No Node SSR)

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cura_postgis_lean
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c max_connections=30
    environment:
      POSTGRES_DB: ${DB_NAME:-cura_db}
      POSTGRES_USER: ${DB_USER:-cura_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cura_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata_lean:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cura_user} -d ${DB_NAME:-cura_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cura_backend_lean
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cura_db}
      DB_USER: ${DB_USER:-cura_user}
      DB_PASSWORD: ${DB_PASSWORD:-cura_password}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ML_ARTIFACT_DIR: /app/ml/artifacts
      ML_ALLOW_MOCK_FALLBACK: "true"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: cura_web_lean
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/out:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata_lean:
