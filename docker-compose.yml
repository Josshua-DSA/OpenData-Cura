services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: healthtrust_postgis
    environment:
      POSTGRES_DB: ${DB_NAME:-cura_db}
      POSTGRES_USER: ${DB_USER:-cura_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cura_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cura_user} -d ${DB_NAME:-cura_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Adminer is a LOCAL-ONLY dev convenience. It must NOT be deployed to a
  # server: no app-level auth and always-on is a security risk there.
  # Start it explicitly only when needed:
  #   docker compose up -d adminer
  #   docker compose stop adminer
  adminer:
    image: adminer:latest
    container_name: healthtrust_adminer
    # restart: always  (REMOVED — do not keep a passwordless DB GUI resident in prod)
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
