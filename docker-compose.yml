services:

  postgres:
    image: postgis/postgis:15-3.3
    container_name: healthtrust_postgis
    environment:
      POSTGRES_DB: ${DB_NAME:-cura_db}
      POSTGRES_USER: ${DB_USER:-cura_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cura_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cura_user} -d ${DB_NAME:-cura_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cura-network  

  adminer:
    image: adminer:latest
    container_name: healthtrust_adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - cura-network  


  backend:
    build: 
      context: .                          
      dockerfile: backend/Dockerfile      
    container_name: healthtrust_backend
    env_file:             
      - .env              
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-cura_user}:${DB_PASSWORD:-cura_password}@postgres:5432/${DB_NAME:-cura_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cura-network

  frontend:
    build: 
      context: ./frontend  
    container_name: healthtrust_frontend
    ports:
      - "3000:3000" 
    depends_on:
      - backend
    networks:
      - cura-network


volumes:
  pgdata: 

networks:
  cura-network:
    driver: bridge